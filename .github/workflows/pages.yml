name: Build and deploy the encyclopedia

on:
  push:
    branches:
      - main
      - claude/wake-encyclopedia-worldbuilding-cvfpk1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          # Project pages are served from /<repo>/. Change if you use a custom domain.
          SITE_BASE: /wake
      # Requires Pages to be enabled once by a repo admin:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # enablement: true does not work here. Creating a Pages site needs admin
      # rights, and a workflow token never has them ("Resource not accessible
      # by integration"). This step will 404 until the switch is flipped.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
